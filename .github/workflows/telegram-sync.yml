name: Telegram job sync

on:
  schedule:
    # Every 20 minutes at off-peak minutes: GitHub often delays or drops schedules that fire at :00.
    # Schedules are best effort; a brand-new repo can take a few hours before the first scheduled run.
    - cron: "7,27,47 * * * *"
  workflow_dispatch: {}

concurrency:
  group: telegram-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/worker/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: node src/sync.mjs
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_GROUPS: ${{ secrets.TELEGRAM_GROUPS }}
          APP_URL: ${{ secrets.APP_URL }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          INITIAL_BACKFILL: "30"
